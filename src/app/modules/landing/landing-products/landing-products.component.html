<app-landing-header></app-landing-header>

<div class="min-h-screen bg-gray-50 pt-8">
    <div class="container mx-auto px-4">
        <!-- Header Section -->
        <div class="text-center mb-12">
            <h1 class="text-3xl font-bold mb-4">Available Products</h1>
            <div class="h-1 w-24 bg-primary-600 mx-auto mb-6"></div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="max-w-2xl mx-auto mb-8">
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p class="font-medium">Error</p>
                <p>{{ error }}</p>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="loading" class="flex justify-center my-12">
            <div class="p-4 rounded-full bg-primary-100 text-primary-600 w-16 h-16 flex items-center justify-center">
                <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary-600"></div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="!loading && products.length === 0" class="text-center my-16">
            <div class="p-4 rounded-full bg-primary-100 text-primary-600 mx-auto mb-4 w-20 h-20 flex items-center justify-center">
                <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">No products found</h3>
            <p class="text-gray-600">There are no available products at the moment.</p>
        </div>

        <!-- Products Grid -->
        <div *ngIf="!loading && products.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let product of products"
                class="bg-white rounded-lg shadow-lg overflow-hidden transition-all duration-300 hover:shadow-xl hover:scale-[1.02]">
                <div class="p-6">
                    <div class="mb-4">
                        <h2 class="text-xl font-bold text-gray-800 mb-2">{{ product.name }}</h2>
                        <p class="text-gray-600 line-clamp-2">{{ product.description }}</p>
                    </div>

                    <div class="space-y-3 mb-6">
                        <div class="flex items-center text-gray-500">
                            <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                                </svg>
                            </div>
                            <span class="font-medium">{{ product.category }}</span>
                        </div>

                        <div class="flex items-center text-gray-500">
                            <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                </svg>
                            </div>
                            <span class="font-medium">{{ product.productType }}</span>
                        </div>

                        <div class="flex items-center text-gray-500">
                            <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </div>
                            <span class="font-medium">{{ product.status }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
