<div class="min-h-screen bg-gray-50 pt-8">
    <div class="container mx-auto px-4">
        <!-- Header Section -->
        <div class="text-center mb-12">
            <h1 class="text-3xl font-bold mb-4">Upcoming Events</h1>
            <div class="h-1 w-24 bg-primary-600 mx-auto mb-6"></div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="max-w-2xl mx-auto mb-8">
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p class="font-medium">Error</p>
                <p>{{ error }}</p>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="loading" class="flex justify-center my-12">
            <div class="p-4 rounded-full bg-primary-100 text-primary-600 w-16 h-16 flex items-center justify-center">
                <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary-600"></div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="!loading && events.length === 0" class="text-center my-16">
            <div class="p-4 rounded-full bg-primary-100 text-primary-600 mx-auto mb-4 w-20 h-20 flex items-center justify-center">
                <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                    </path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">No events found</h3>
            <p class="text-gray-600">There are no upcoming events at the moment.</p>
        </div>

        <!-- Events Grid -->
        <div *ngIf="!loading && events.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let event of events"
                class="bg-white rounded-lg shadow-lg overflow-hidden transition-all duration-300 hover:shadow-xl hover:scale-[1.02]">
                <div class="p-6">
                    <div class="mb-4">
                        <h2 class="text-xl font-bold text-gray-800 mb-2">{{ event.title }}</h2>
                        <p class="text-gray-600 line-clamp-2">{{ event.objective }}</p>
                    </div>
                    
                    <div class="space-y-3 mb-6">
                        <div class="flex items-center text-gray-500">
                            <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <span class="font-medium">{{ event.date | date:'mediumDate' }}</span>
                        </div>

                        <div class="flex items-center text-gray-500">
                            <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </div>
                            <span class="font-medium">{{ event.location }}</span>
                        </div>

                        <div class="flex items-center text-gray-500">
                            <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                            </div>
                            <span class="font-medium">{{ event.numbre }} Participants</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
