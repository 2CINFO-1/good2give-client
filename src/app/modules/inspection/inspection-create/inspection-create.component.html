<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-xl font-semibold text-gray-900">Create New Inspection</h1>
        <button (click)="cancel()"
            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-gray-700 bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            <svg class="-ml-1 mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                    clip-rule="evenodd" />
            </svg>
            Cancel
        </button>
    </div>

    <div class="bg-white shadow overflow-hidden sm:rounded-lg">
        <form [formGroup]="inspectionForm" (ngSubmit)="onSubmit()">
            <div class="px-4 py-5 sm:p-6">
                <!-- Basic Information -->
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
                    <div>
                        <label for="inspectorId" class="block text-sm font-medium text-gray-700">Inspector ID</label>
                        <input type="text" name="inspectorId" id="inspectorId" formControlName="inspectorId"
                            class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                        <div *ngIf="inspectionForm.get('inspectorId')?.invalid && (inspectionForm.get('inspectorId')?.dirty || inspectionForm.get('inspectorId')?.touched)"
                            class="mt-1 text-sm text-red-600">
                            <div *ngIf="inspectionForm.get('inspectorId')?.errors?.['required']">Inspector ID is
                                required.</div>
                        </div>
                    </div>

                    <div>
                        <label for="facilityId" class="block text-sm font-medium text-gray-700">Facility ID</label>
                        <input type="text" name="facilityId" id="facilityId" formControlName="facilityId"
                            class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                        <div *ngIf="inspectionForm.get('facilityId')?.invalid && (inspectionForm.get('facilityId')?.dirty || inspectionForm.get('facilityId')?.touched)"
                            class="mt-1 text-sm text-red-600">
                            <div *ngIf="inspectionForm.get('facilityId')?.errors?.['required']">Facility ID is required.
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="inspectionDate" class="block text-sm font-medium text-gray-700">Inspection
                            Date</label>
                        <input type="date" name="inspectionDate" id="inspectionDate" formControlName="inspectionDate"
                            class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                        <div *ngIf="inspectionForm.get('inspectionDate')?.invalid && (inspectionForm.get('inspectionDate')?.dirty || inspectionForm.get('inspectionDate')?.touched)"
                            class="mt-1 text-sm text-red-600">
                            <div *ngIf="inspectionForm.get('inspectionDate')?.errors?.['required']">Inspection date is
                                required.</div>
                        </div>
                    </div>

                    <div>
                        <label for="checklistId" class="block text-sm font-medium text-gray-700">Checklist ID</label>
                        <input type="text" name="checklistId" id="checklistId" formControlName="checklistId"
                            class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                        <div *ngIf="inspectionForm.get('checklistId')?.invalid && (inspectionForm.get('checklistId')?.dirty || inspectionForm.get('checklistId')?.touched)"
                            class="mt-1 text-sm text-red-600">
                            <div *ngIf="inspectionForm.get('checklistId')?.errors?.['required']">Checklist ID is
                                required.</div>
                        </div>
                    </div>
                </div>

                <!-- Notes Section -->
                <div class="mt-6">
                    <label for="inspectorNotes" class="block text-sm font-medium text-gray-700">Inspector Notes</label>
                    <div class="mt-1">
                        <textarea id="inspectorNotes" name="inspectorNotes" rows="3" formControlName="inspectorNotes"
                            class="shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md"></textarea>
                    </div>
                </div>

                <!-- Results Section -->
                <div class="mt-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg leading-6 font-medium text-gray-900">Inspection Results</h3>
                        <button type="button" (click)="addResult()"
                            class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-indigo-700 bg-indigo-100 hover:bg-indigo-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            <svg class="-ml-1 mr-1 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                                    clip-rule="evenodd" />
                            </svg>
                            Add Result
                        </button>
                    </div>

                    <div *ngIf="resultsArray.length === 0"
                        class="mt-4 p-4 bg-gray-50 border border-gray-200 rounded-md">
                        <p class="text-sm text-gray-500 text-center">No results added yet. Click "Add Result" to add
                            one.</p>
                    </div>

                    <div *ngIf="resultsArray.length > 0" class="mt-4 space-y-4">
                        <div formArrayName="results" class="space-y-4">
                            <div *ngFor="let result of resultsArray.controls; let i = index" [formGroupName]="i"
                                class="bg-gray-50 p-4 border border-gray-200 rounded-md">
                                <div class="flex justify-between items-start">
                                    <h4 class="text-sm font-medium text-gray-700">Result {{ i + 1 }}</h4>
                                    <button type="button" (click)="removeResult(i)"
                                        class="text-red-600 hover:text-red-800">
                                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                            fill="currentColor">
                                            <path fill-rule="evenodd"
                                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                                clip-rule="evenodd" />
                                        </svg>
                                    </button>
                                </div>

                                <div class="grid grid-cols-1 gap-4 mt-3 sm:grid-cols-2">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Item</label>
                                        <input type="text" formControlName="item"
                                            class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                                    </div>

                                    <div>
                                        <label class="block text-sm font-medium text-gray-700">Status</label>
                                        <select formControlName="status"
                                            class="mt-1 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                                            <option value="pass">Pass</option>
                                            <option value="fail">Fail</option>
                                            <option value="na">N/A</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="mt-3">
                                    <label class="block text-sm font-medium text-gray-700">Comment</label>
                                    <textarea formControlName="comment" rows="2"
                                        class="mt-1 shadow-sm focus:ring-blue-500 focus:border-blue-500 block w-full sm:text-sm border-gray-300 rounded-md"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Issues Section -->
                <div class="mt-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-lg leading-6 font-medium text-gray-900">Issues</h3>
                        <button type="button" (click)="addIssue()"
                            class="inline-flex items-center px-3 py-1.5 border border-transparent text-xs font-medium rounded-md text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                            <svg class="-ml-1 mr-1 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                                    clip-rule="evenodd" />
                            </svg>
                            Add Issue
                        </button>
                    </div>

                    <div *ngIf="issuesArray.length === 0" class="mt-4 p-4 bg-gray-50 border border-gray-200 rounded-md">
                        <p class="text-sm text-gray-500 text-center">No issues added yet.</p>
                    </div>

                    <div *ngIf="issuesArray.length > 0" class="mt-4">
                        <div formArrayName="issues" class="space-y-3">
                            <div *ngFor="let issue of issuesArray.controls; let i = index"
                                class="flex items-center space-x-3">
                                <input type="text" [formControlName]="i"
                                    class="flex-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md">
                                <button type="button" (click)="removeIssue(i)" class="text-red-600 hover:text-red-800">
                                    <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                        fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="px-4 py-3 bg-gray-50 text-right sm:px-6">
                <button type="button" (click)="cancel()"
                    class="mr-2 inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Cancel
                </button>
                <button type="submit" [disabled]="inspectionForm.invalid || submitting"
                    class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50">
                    <svg *ngIf="submitting" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Save Inspection
                </button>
            </div>
        </form>
    </div>
</div>
