<div class="container mx-auto p-4" title="Inspection Report Container">
  <div class="bg-white rounded-lg shadow-sm p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-2xl font-bold text-gray-800">Create New Inspection Report</h3>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ error }}</p>
        </div>
      </div>
    </div>

    <!-- Inspection Form -->
    <form [formGroup]="form">
      <!-- Type (Delivery or Depot) -->
      <div class="mb-4">
        <label for="type" class="block text-sm font-medium text-gray-700">Inspection Type *</label>
        <select
          id="type"
          formControlName="type"
          class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
          [ngClass]="{ 'border-red-500': form.get('type')?.invalid && form.get('type')?.touched }"
        >
          <option value="delivery">Delivery</option>
          <option value="depot">Depot</option>
        </select>
        <div *ngIf="form.get('type')?.invalid && form.get('type')?.touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="form.get('type')?.errors?.['required']">Inspection type is required</span>
        </div>
      </div>

      <!-- Delivery ID -->
      <div class="mb-4">
        <label for="deliveryId" class="block text-sm font-medium text-gray-700">Delivery ID</label>
        <input
          type="text"
          id="deliveryId"
          formControlName="deliveryId"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
        />
      </div>

      <!-- Depot ID -->
      <div class="mb-4">
        <label for="depotId" class="block text-sm font-medium text-gray-700">Depot ID</label>
        <input
          type="text"
          id="depotId"
          formControlName="depotId"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
        />
      </div>

      <!-- Inspection Date -->
      <div class="mb-4">
        <label for="inspectionDate" class="block text-sm font-medium text-gray-700">Inspection Date *</label>
        <input
          type="date"
          id="inspectionDate"
          formControlName="inspectionDate"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
          [ngClass]="{ 'border-red-500': form.get('inspectionDate')?.invalid && form.get('inspectionDate')?.touched }"
        />
        <div *ngIf="form.get('inspectionDate')?.invalid && form.get('inspectionDate')?.touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="form.get('inspectionDate')?.errors?.['required']">Inspection date is required</span>
        </div>
      </div>

      <!-- Issues -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-2">
          <label class="block text-sm font-medium text-gray-700">Issues</label>
          <button
            type="button"
            (click)="addIssue()"
            class="inline-flex items-center px-3 py-1 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500"
          >
            Add Issue
          </button>
        </div>

        <div *ngIf="issues.length === 0" class="text-center py-4 bg-gray-50 border border-gray-200 rounded-md">
          <p class="text-sm text-gray-500">No issues added yet. Click "Add Issue" to include issues.</p>
        </div>

        <div formArrayName="issues" *ngIf="issues.length > 0" class="space-y-4">
          <div *ngFor="let issue of issues.controls; let i = index" [formGroupName]="i" class="p-4 border border-gray-200 rounded-md bg-gray-50">
            <div class="flex justify-between mb-3">
              <h4 class="text-sm font-medium text-gray-700">Issue #{{ i + 1 }}</h4>
              <button type="button" (click)="removeIssue(i)" class="text-red-600 hover:text-red-900 text-sm font-medium">
                Remove
              </button>
            </div>

            <!-- Type -->
            <div class="mb-3">
              <label [for]="'type-' + i" class="block text-sm font-medium text-gray-700">Type *</label>
              <input
                [id]="'type-' + i"
                formControlName="type"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                [ngClass]="{ 'border-red-500': issue.get('type')?.invalid && issue.get('type')?.touched }"
              />
              <div *ngIf="issue.get('type')?.invalid && issue.get('type')?.touched" class="text-red-500 text-sm mt-1">
                <span *ngIf="issue.get('type')?.errors?.['required']">Type is required</span>
              </div>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label [for]="'description-' + i" class="block text-sm font-medium text-gray-700">Description *</label>
              <textarea
                [id]="'description-' + i"
                formControlName="description"
                rows="2"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                [ngClass]="{ 'border-red-500': issue.get('description')?.invalid && issue.get('description')?.touched }"
              ></textarea>
              <div *ngIf="issue.get('description')?.invalid && issue.get('description')?.touched" class="text-red-500 text-sm mt-1">
                <span *ngIf="issue.get('description')?.errors?.['required']">Description is required</span>
              </div>
            </div>

            <!-- Severity -->
            <div class="mb-3">
              <label [for]="'severity-' + i" class="block text-sm font-medium text-gray-700">Severity *</label>
              <select
                [id]="'severity-' + i"
                formControlName="severity"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                [ngClass]="{ 'border-red-500': issue.get('severity')?.invalid && issue.get('severity')?.touched }"
              >
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
              <div *ngIf="issue.get('severity')?.invalid && issue.get('severity')?.touched" class="text-red-500 text-sm mt-1">
                <span *ngIf="issue.get('severity')?.errors?.['required']">Severity is required</span>
              </div>
            </div>

            <!-- Status -->
            <div class="mb-3">
              <label [for]="'status-' + i" class="block text-sm font-medium text-gray-700">Status *</label>
              <select
                [id]="'status-' + i"
                formControlName="status"
                class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
                [ngClass]="{ 'border-red-500': issue.get('status')?.invalid && issue.get('status')?.touched }"
              >
                <option value="failed">Failed</option>
                <option value="reviewing">Reviewing</option>
                <option value="rejected">Rejected</option>
              </select>
              <div *ngIf="issue.get('status')?.invalid && issue.get('status')?.touched" class="text-red-500 text-sm mt-1">
                <span *ngIf="issue.get('status')?.errors?.['required']">Status is required</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Inspector Notes -->
      <div class="mb-4">
        <label for="inspectorNotes" class="block text-sm font-medium text-gray-700">Inspector Notes</label>
        <textarea
          id="inspectorNotes"
          formControlName="inspectorNotes"
          rows="3"
          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
        ></textarea>
      </div>

      <!-- Status -->
      <div class="mb-4">
        <label for="status" class="block text-sm font-medium text-gray-700">Status *</label>
        <select
          id="status"
          formControlName="status"
          class="mt-1 block w-full bg-white border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm"
          [ngClass]="{ 'border-red-500': form.get('status')?.invalid && form.get('status')?.touched }"
        >
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <div *ngIf="form.get('status')?.invalid && form.get('status')?.touched" class="text-red-500 text-sm mt-1">
          <span *ngIf="form.get('status')?.errors?.['required']">Status is required</span>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end">
        <button
          type="button"
          class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors"
          (click)="onSubmit()"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
</div>
