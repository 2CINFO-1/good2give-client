<div class="container mx-auto p-4">
  <div class="bg-white rounded-lg shadow-sm p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-semibold text-gray-800">My Inspection Reports</h1>
      <button
        (click)="createInspection()"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors"
      >
        <span class="material-icons mr-1 text-sm">add</span>
        Create New Inspection
      </button>
    </div>

    <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
      <div class="flex">
        <div class="flex-shrink-0">
          <svg
            class="h-5 w-5 text-red-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ error }}</p>
        </div>
      </div>
    </div>

    <div *ngIf="loading" class="flex justify-center py-8">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
    </div>

    <div *ngIf="!loading && inspections.length === 0" class="text-center py-8 text-gray-500">
      No inspection reports found. Create a new one to get started.
    </div>

    <div *ngIf="!loading && inspections.length > 0" class="overflow-x-auto">
      <table class="min-w-full">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Inspector Name
            </th>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Inspection Date
            </th>
            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Status
            </th>
            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let inspection of inspections" class="hover:bg-gray-50 cursor-pointer transition-colors">
            <td class="px-4 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
              {{ inspection.inspectorId?.name || 'Unknown Inspector' }}
            </td>
            <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-800">
              {{ formatDate(inspection.inspectionDate) }}
            </td>
            <td class="px-4 py-4 whitespace-nowrap">
              <span
                class="px-2 py-1 text-xs rounded-full"
                [ngClass]="{
                  'bg-blue-100 text-blue-800': inspection.status === 'pending',
                  'bg-green-100 text-green-800': inspection.status === 'approved',
                  'bg-red-100 text-red-800': inspection.status === 'rejected'
                }"
              >
                {{ inspection.status | titlecase }}
              </span>
            </td>
            <td class="px-4 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button
                (click)="viewDetails(inspection._id!)"
                class="text-blue-600 hover:text-blue-900"
              >
                View
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
