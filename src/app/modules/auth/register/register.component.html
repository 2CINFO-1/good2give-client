<style>
    html,
    body {
        height: 100%;
        margin: 0;
        overflow: auto;
    }
</style>
<div class="bg-gray-50 min-h-screen h-full overflow-y-auto">
    <div class="px-4 py-6 sm:py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-xl px-4 my-auto">
            <div class="bg-white p-6 md:p-10 shadow rounded-2xl">
                <div class="text-center">
                    <h2 class="text-3xl font-bold mb-4 text-gray-900">Create your account</h2>
                    <div class="h-1 w-24 bg-primary-600 mx-auto mb-6"></div>
                    <p class="text-gray-600 mb-6">
                        Or
                        <a routerLink="/auth/login" class="font-medium text-primary-600 hover:text-primary-700">
                            sign in to your account
                        </a>
                    </p>
                </div>

                <!-- Google sign in button -->
                <div class="mb-6">
                    <button type="button" (click)="signInWithGoogle()"
                        class="w-full flex items-center justify-center bg-white border border-gray-300 rounded-lg shadow-sm py-3 px-4 text-gray-700 font-medium hover:bg-gray-50 focus:outline-none  transition-all">
                        <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                                <path fill="#4285F4"
                                    d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z" />
                                <path fill="#34A853"
                                    d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z" />
                                <path fill="#FBBC05"
                                    d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z" />
                                <path fill="#EA4335"
                                    d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z" />
                            </g>
                        </svg>
                        Sign up with Google
                    </button>
                </div>

                <!-- Divider -->
                <div class="flex items-center mb-6">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-600">or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>

                <!-- Error message display -->
                <div *ngIf="errorMessage"
                    class="mb-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg" role="alert">
                    <span class="block sm:inline">{{ errorMessage }}</span>
                </div>

                <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Name field -->
                        <div>
                            <label for="name" class="block text-gray-700 font-medium mb-2">Full Name</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400"
                                        viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </div>
                                <input type="text" id="name" formControlName="name"
                                    class="pl-10 pr-4 py-3 w-full bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                    placeholder="John Doe">
                            </div>
                            <div *ngIf="f['name'].touched && f['name'].invalid" class="text-red-600 mt-1 text-sm">
                                <span *ngIf="f['name'].errors?.['required']">Name is required</span>
                            </div>
                        </div>

                        <!-- Email field -->
                        <div>
                            <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400"
                                        viewBox="0 0 20 20" fill="currentColor">
                                        <path
                                            d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                                        <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                                    </svg>
                                </div>
                                <input type="email" id="email" formControlName="email"
                                    class="pl-10 pr-4 py-3 w-full bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                    placeholder="you@example.com">
                            </div>
                            <div *ngIf="f['email'].touched && f['email'].invalid" class="text-red-600 mt-1 text-sm">
                                <span *ngIf="f['email'].errors?.['required']">Email is required</span>
                                <span *ngIf="f['email'].errors?.['email']">Please enter a valid email address</span>
                            </div>
                        </div>

                        <!-- Password field -->
                        <div>
                            <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400"
                                        viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </div>
                                <input type="password" id="password" formControlName="password"
                                    class="pl-10 pr-4 py-3 w-full bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                    placeholder="••••••••">
                            </div>
                            <div *ngIf="f['password'].touched && f['password'].invalid"
                                class="text-red-600 mt-1 text-sm">
                                <span *ngIf="f['password'].errors?.['required']">Password is required</span>
                                <span *ngIf="f['password'].errors?.['minlength']">Password must be at least 8
                                    characters</span>
                            </div>
                        </div>

                        <!-- Confirm Password field -->
                        <div>
                            <label for="confirmPassword" class="block text-gray-700 font-medium mb-2">Confirm
                                Password</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400"
                                        viewBox="0 0 20 20" fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                            clip-rule="evenodd" />
                                    </svg>
                                </div>
                                <input type="password" id="confirmPassword" formControlName="confirmPassword"
                                    class="pl-10 pr-4 py-3 w-full bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                    placeholder="••••••••">
                            </div>
                            <div *ngIf="f['confirmPassword'].touched && f['confirmPassword'].invalid"
                                class="text-red-600 mt-1 text-sm">
                                <span *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your
                                    password</span>
                            </div>
                            <div *ngIf="registerForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched"
                                class="text-red-600 mt-1 text-sm">
                                Passwords do not match
                            </div>
                        </div>
                    </div>

                    <!-- Role selection -->
                    <div>
                        <label for="role" class="block text-gray-700 font-medium mb-2">I am registering as a</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path
                                        d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
                                </svg>
                            </div>
                            <select id="role" formControlName="role"
                                class="pl-10 pr-4 py-3 w-full bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all appearance-none">
                                <option [value]="'donator'">Donor</option>
                                <option [value]="'beneficiary'">Beneficiary</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                                        clip-rule="evenodd" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Terms and conditions checkbox -->
                    <div>
                        <div class="flex items-center">
                            <input id="agreedToTerms" type="checkbox" formControlName="agreedToTerms"
                                class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded" />
                            <label for="agreedToTerms" class="ml-2 block text-sm text-gray-700">
                                I agree to the
                                <a href="#" class="font-medium text-primary-600 hover:text-primary-700">Terms and
                                    Conditions</a>
                                and
                                <a href="#" class="font-medium text-primary-600 hover:text-primary-700">Privacy
                                    Policy</a>
                            </label>
                        </div>
                        <div *ngIf="f['agreedToTerms'].touched && f['agreedToTerms'].invalid"
                            class="text-red-600 mt-1 text-sm">
                            <span *ngIf="f['agreedToTerms'].errors?.['required']">You must agree to the terms and
                                conditions</span>
                        </div>
                    </div>

                    <!-- Submit button -->
                    <button type="submit" [disabled]="registerForm.invalid || isSubmitting"
                        class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-6 rounded-lg transition-all transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 shadow-lg"
                        [class.opacity-50]="registerForm.invalid || isSubmitting"
                        [class.cursor-not-allowed]="registerForm.invalid || isSubmitting">
                        <span *ngIf="isSubmitting" class="inline-block mr-2">
                            <svg class="animate-spin h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4">
                                </circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </span>
                        {{ isSubmitting ? 'Creating account...' : 'Create account' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
