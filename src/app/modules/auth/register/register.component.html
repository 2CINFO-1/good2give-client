<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">
            Create your account
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Already have an account?
            <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-500">
                Sign in
            </a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            <!-- Error message display -->
            <div *ngIf="errorMessage"
                class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span class="block sm:inline">{{ errorMessage }}</span>
            </div>

            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <!-- Name field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                    <div class="mt-1">
                        <input id="name" name="name" type="text" formControlName="name"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                    </div>
                    <div *ngIf="f['name'].touched && f['name'].invalid" class="mt-1 text-sm text-red-600">
                        <div *ngIf="f['name'].errors?.['required']">Name is required</div>
                    </div>
                </div>

                <!-- Email field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" formControlName="email"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                    </div>
                    <div *ngIf="f['email'].touched && f['email'].invalid" class="mt-1 text-sm text-red-600">
                        <div *ngIf="f['email'].errors?.['required']">Email is required</div>
                        <div *ngIf="f['email'].errors?.['email']">Please enter a valid email address</div>
                    </div>
                </div>

                <!-- Password field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="new-password"
                            formControlName="password"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                    </div>
                    <div *ngIf="f['password'].touched && f['password'].invalid" class="mt-1 text-sm text-red-600">
                        <div *ngIf="f['password'].errors?.['required']">Password is required</div>
                        <div *ngIf="f['password'].errors?.['minlength']">Password must be at least 8 characters</div>
                    </div>
                </div>

                <!-- Confirm Password field -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm
                        Password</label>
                    <div class="mt-1">
                        <input id="confirmPassword" name="confirmPassword" type="password"
                            formControlName="confirmPassword"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
                    </div>
                    <div *ngIf="f['confirmPassword'].touched && f['confirmPassword'].invalid"
                        class="mt-1 text-sm text-red-600">
                        <div *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your password</div>
                    </div>
                    <div *ngIf="registerForm.errors?.['passwordMismatch'] && f['confirmPassword'].touched"
                        class="mt-1 text-sm text-red-600">
                        Passwords do not match
                    </div>
                </div>

                <!-- Role selection -->
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-700">I am registering as a</label>
                    <div class="mt-1">
                        <select id="role" name="role" formControlName="role"
                            class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                            <option [value]="'donator'">Donor</option>
                            <option [value]="'beneficiary'">Beneficiary</option>
                        </select>
                    </div>
                </div>

                <!-- Terms and conditions checkbox -->
                <div class="flex items-center">
                    <input id="agreedToTerms" name="agreedToTerms" type="checkbox" formControlName="agreedToTerms"
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
                    <label for="agreedToTerms" class="ml-2 block text-sm text-gray-900">
                        I agree to the
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Terms and Conditions</a>
                        and
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Privacy Policy</a>
                    </label>
                </div>
                <div *ngIf="f['agreedToTerms'].touched && f['agreedToTerms'].invalid" class="mt-1 text-sm text-red-600">
                    <div *ngIf="f['agreedToTerms'].errors?.['required']">You must agree to the terms and conditions
                    </div>
                </div>

                <!-- Submit button -->
                <div>
                    <button type="submit" [disabled]="registerForm.invalid || isSubmitting"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        {{ isSubmitting ? 'Creating account...' : 'Create account' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
