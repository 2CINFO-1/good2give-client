<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="p-8 md:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold mb-4 text-gray-900">Forgot your password?</h2>
                    <div class="h-1 w-24 bg-primary-600 mx-auto mb-6"></div>
                    <p class="text-gray-600">
                        Enter your email address and we'll send you a link to reset your password.
                    </p>
                </div>

                <!-- Success message after form submission -->
                <div *ngIf="emailSent" class="rounded-md bg-green-50 p-4 mb-6">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-green-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"
                                fill="currentColor" aria-hidden="true">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="ml-3">
                            <h3 class="text-sm font-medium text-green-800">Email sent</h3>
                            <div class="mt-2 text-sm text-green-700">
                                <p>We've sent a password reset link to your email address. Please check your inbox.</p>
                            </div>
                            <div class="mt-4">
                                <button type="button" (click)="backToLogin()"
                                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-primary-700 bg-primary-100 hover:bg-primary-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-colors">
                                    Back to login
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Error message display -->
                <div *ngIf="errorMessage && !emailSent"
                    class="mb-6 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg" role="alert">
                    <span class="block sm:inline">{{ errorMessage }}</span>
                </div>

                <!-- Password reset form -->
                <form *ngIf="!emailSent" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
                    <div class="mb-6">
                        <label for="email" class="block text-gray-700 font-medium mb-2">Email address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400"
                                    viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                                </svg>
                            </div>
                            <input id="email" name="email" type="email" autocomplete="email" formControlName="email"
                                required
                                class="pl-10 pr-4 py-3 w-full bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                placeholder="you@example.com" />
                        </div>
                        <div *ngIf="f['email'].touched && f['email'].invalid" class="text-red-600 mt-1 text-sm">
                            <span *ngIf="f['email'].errors?.['required']">Email is required</span>
                            <span *ngIf="f['email'].errors?.['email']">Please enter a valid email address</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <div class="text-sm">
                            <a routerLink="/auth/login"
                                class="font-medium text-primary-600 hover:text-primary-700 transition-colors">
                                Return to login
                            </a>
                        </div>
                    </div>

                    <button type="submit" [disabled]="forgotPasswordForm.invalid || isSubmitting"
                        class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-3 px-6 rounded-lg transition-all transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-opacity-50 shadow-lg"
                        [class.opacity-50]="forgotPasswordForm.invalid || isSubmitting"
                        [class.cursor-not-allowed]="forgotPasswordForm.invalid || isSubmitting">
                        <span *ngIf="isSubmitting" class="inline-block mr-2">
                            <svg class="animate-spin h-5 w-5 text-white inline" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4">
                                </circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </span>
                        {{ isSubmitting ? 'Sending...' : 'Reset password' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
