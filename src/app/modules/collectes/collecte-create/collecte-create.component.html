<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Schedule Collection</h1>
        <button (click)="cancel()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md">
            Cancel
        </button>
    </div>

    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        {{ error }}
    </div>

    <div class="bg-white shadow-md rounded-lg p-6">
        <form [formGroup]="collecteForm" (ngSubmit)="onSubmit()">
            <!-- Title -->
            <div class="mb-6">
                <label for="title" class="block text-gray-700 text-sm font-medium mb-2">Title*</label>
                <input type="text" id="title" formControlName="title"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <div *ngIf="formControls['title'].touched && formControls['title'].errors?.['required']"
                    class="text-red-500 text-sm mt-1">
                    Title is required
                </div>
            </div>

            <!-- Description -->
            <div class="mb-6">
                <label for="description" class="block text-gray-700 text-sm font-medium mb-2">Description*</label>
                <textarea id="description" formControlName="description" rows="3"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
                <div *ngIf="formControls['description'].touched && formControls['description'].errors?.['required']"
                    class="text-red-500 text-sm mt-1">
                    Description is required
                </div>
            </div>

            <!-- Location -->
            <div class="mb-6">
                <label for="location" class="block text-gray-700 text-sm font-medium mb-2">Location*</label>
                <input type="text" id="location" formControlName="location"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <div *ngIf="formControls['location'].touched && formControls['location'].errors?.['required']"
                    class="text-red-500 text-sm mt-1">
                    Location is required
                </div>
            </div>

            <!-- Items Section -->
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-medium mb-2">Collection Items*</label>
                <div formArrayName="items">
                    <div *ngFor="let item of itemsControls; let i = index" [formGroupName]="i"
                        class="flex flex-wrap mb-2 items-start">
                        <div class="w-full md:w-1/3 pr-2 mb-2 md:mb-0">
                            <input type="text" formControlName="name" placeholder="Item Name"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <div *ngIf="item.get('name')?.touched && item.get('name')?.errors?.['required']"
                                class="text-red-500 text-xs mt-1">
                                Item name is required
                            </div>
                        </div>
                        <div class="w-full md:w-1/4 pr-2 mb-2 md:mb-0">
                            <input type="number" formControlName="quantity" placeholder="Quantity"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                            <div *ngIf="item.get('quantity')?.touched && item.get('quantity')?.errors?.['required']"
                                class="text-red-500 text-xs mt-1">
                                Quantity is required
                            </div>
                        </div>
                        <div class="w-full md:w-1/4 pr-2 mb-2 md:mb-0">
                            <input type="text" formControlName="unit" placeholder="Unit (e.g. kg, pcs)"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div class="w-full md:w-auto flex items-center mt-2 md:mt-0">
                            <button type="button" (click)="removeItem(i)" class="text-red-500 hover:text-red-700">
                                <span class="material-icons">delete</span>
                            </button>
                        </div>
                    </div>
                    <button type="button" (click)="addItem()"
                        class="mt-2 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 flex items-center">
                        <span class="material-icons text-sm mr-1">add</span>
                        Add Item
                    </button>
                </div>
                <div *ngIf="itemsFormArray.length === 0" class="text-red-500 text-sm mt-1">
                    At least one item is required
                </div>
            </div>

            <!-- Transporter Selection (Optional) -->
            <div class="mb-6">
                <label for="transporterId" class="block text-gray-700 text-sm font-medium mb-2">Assign Transporter
                    (Optional)</label>
                <div *ngIf="isLoadingTransporters" class="flex items-center">
                    <div class="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin mr-2">
                    </div>
                    <span>Loading transporters...</span>
                </div>
                <select *ngIf="!isLoadingTransporters" id="transporterId" formControlName="transporterId"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select a transporter (optional)</option>
                    <option *ngFor="let transporter of transporters" [value]="transporter._id">
                        {{ transporter.firstName }} {{ transporter.lastName }} ({{ transporter.email }})
                    </option>
                </select>
                <div *ngIf="!isLoadingTransporters && transporters.length === 0" class="text-gray-500 text-sm mt-1">
                    No transporters available
                </div>
            </div>

            <!-- Scheduled Date -->
            <div class="mb-6">
                <label for="scheduledDate" class="block text-gray-700 text-sm font-medium mb-2">Scheduled Date*</label>
                <input type="datetime-local" id="scheduledDate" formControlName="scheduledDate"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                <div *ngIf="formControls['scheduledDate'].touched && formControls['scheduledDate'].errors?.['required']"
                    class="text-red-500 text-sm mt-1">
                    Scheduled date is required
                </div>
            </div>

            <!-- Notes -->
            <div class="mb-6">
                <label for="notes" class="block text-gray-700 text-sm font-medium mb-2">Notes (Optional)</label>
                <textarea id="notes" formControlName="notes" rows="4"
                    placeholder="Any special instructions or notes for the collection"
                    class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end">
                <button type="submit" [disabled]="collecteForm.invalid || isLoading"
                    class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50">
                    <span *ngIf="isLoading" class="flex items-center">
                        <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin mr-2">
                        </div>
                        Scheduling...
                    </span>
                    <span *ngIf="!isLoading">Schedule Collection</span>
                </button>
            </div>
        </form>
    </div>
</div>
