<div class="container mx-auto p-4">
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Add New Stock</h1>
            <button (click)="cancel()" class="text-blue-600 flex items-center">
                <span class="material-icons text-sm mr-1">arrow_back</span>
                Back to Stocks
            </button>
        </div>

        <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ errorMessage }}
        </div>

        <div *ngIf="isLoading" class="flex justify-center py-8">
            <svg class="animate-spin h-8 w-8 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
        </div>

        <form [formGroup]="stockForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading" class="space-y-6">
            <div>
                <label for="productId" class="block text-sm font-medium text-gray-700 mb-1">
                    Product *
                </label>
                <select id="productId" formControlName="productId"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                    <option value="">Select a product</option>
                    <option *ngFor="let product of products" [value]="product._id">
                        {{ product.name }} ({{ product.category }})
                    </option>
                </select>
                <div *ngIf="stockForm.get('productId')?.invalid && stockForm.get('productId')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Product is required
                </div>
            </div>

            <div>
                <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">
                    Quantity *
                </label>
                <input type="number" id="quantity" formControlName="quantity" min="1"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                <div *ngIf="stockForm.get('quantity')?.invalid && stockForm.get('quantity')?.touched"
                    class="text-red-500 text-sm mt-1">
                    <div *ngIf="stockForm.get('quantity')?.errors?.['required']">Quantity is required</div>
                    <div *ngIf="stockForm.get('quantity')?.errors?.['min']">Quantity must be at least 1</div>
                </div>
            </div>

            <div>
                <label for="expiryDate" class="block text-sm font-medium text-gray-700 mb-1">
                    Expiry Date *
                </label>
                <input type="date" id="expiryDate" formControlName="expiryDate"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
                <div *ngIf="stockForm.get('expiryDate')?.invalid && stockForm.get('expiryDate')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Expiry date is required
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" (click)="cancel()"
                    class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">
                    Cancel
                </button>
                <button type="submit" [disabled]="stockForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <span *ngIf="isSubmitting" class="flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Saving...
                    </span>
                    <span *ngIf="!isSubmitting">Save</span>
                </button>
            </div>
        </form>
    </div>
</div>
