<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Collections</h1>
        <!-- You can add a button to create collections if needed -->
    </div>

    <!-- Loading state -->
    <div *ngIf="loading" class="flex justify-center my-8">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
    </div>

    <!-- Error state -->
    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6">
        <span class="block sm:inline">{{ error }}</span>
    </div>

    <!-- No results -->
    <div *ngIf="!loading && collectes.length === 0" class="bg-gray-50 p-6 text-center rounded-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400 mb-4" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <h3 class="text-lg font-medium text-gray-900 mb-2">No collections found</h3>
        <p class="text-gray-500">There are no collections scheduled at this time.</p>
    </div>

    <!-- Collections list -->
    <div *ngIf="!loading && collectes.length > 0" class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Donation
                    </th>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status
                    </th>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Scheduled
                        Date
                    </th>
                    <th scope="col"
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let collecte of collectes">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-blue-600">
                        <a [routerLink]="['/dashboard/collecte', collecte._id]">
                            {{ collecte._id }}
                        </a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        {{ getDonationId(collecte.donation) }}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" [ngClass]="{
                            'bg-yellow-100 text-yellow-800': collecte.status === CollecteStatus.PENDING,
                            'bg-blue-100 text-blue-800': collecte.status === CollecteStatus.ASSIGNED || collecte.status === CollecteStatus.IN_PROGRESS,
                            'bg-green-100 text-green-800': collecte.status === CollecteStatus.COMPLETED,
                            'bg-red-100 text-red-800': collecte.status === CollecteStatus.FAILED || collecte.status === CollecteStatus.CANCELLED
                          }">
                            {{ collecte.status }}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        {{ formatDate(collecte.scheduledDate) }}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <div class="flex space-x-2">
                            <a [routerLink]="['/dashboard/collecte', collecte._id]"
                                class="text-blue-600 hover:text-blue-800">
                                View
                            </a>
                            <button *ngIf="collecte.status === CollecteStatus.PENDING && !collecte.transporter"
                                (click)="assignTransporter(collecte._id)" class="text-green-600 hover:text-green-800">
                                Assign
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div *ngIf="totalItems > pageSize" class="flex justify-center mt-6">
        <nav class="flex space-x-2" aria-label="Pagination">
            <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1"
                class="px-3 py-1 rounded-md bg-white border border-gray-300 text-gray-500 hover:bg-gray-50"
                [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === 1}">
                Previous
            </button>
            <div *ngFor="let page of getPagesArray()">
                <button (click)="onPageChange(page)" class="px-3 py-1 rounded-md" [ngClass]="{
                    'bg-blue-600 text-white': currentPage === page,
                    'bg-white border border-gray-300 text-gray-500 hover:bg-gray-50': currentPage !== page
                }">
                    {{ page }}
                </button>
            </div>
            <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage >= Math.ceil(totalItems / pageSize)"
                class="px-3 py-1 rounded-md bg-white border border-gray-300 text-gray-500 hover:bg-gray-50"
                [ngClass]="{'opacity-50 cursor-not-allowed': currentPage >= Math.ceil(totalItems / pageSize)}">
                Next
            </button>
        </nav>
    </div>
</div>
