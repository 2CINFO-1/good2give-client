<div class="p-6 max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <div>
            <button (click)="goBack()" class="inline-flex items-center text-gray-700 hover:text-gray-900">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Collection Details
            </button>
            <h1 class="text-2xl font-bold mt-2">Assign Transporter</h1>
        </div>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center h-64">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                        clip-rule="evenodd"></path>
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm text-red-700">{{ errorMessage }}</p>
            </div>
        </div>
    </div>

    <!-- Collecte Summary -->
    <div *ngIf="!loading && collecte" class="mb-8">
        <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <div class="px-4 py-5 sm:px-6 bg-gray-50">
                <h3 class="text-lg leading-6 font-medium text-gray-900">Collection Summary</h3>
            </div>
            <div class="border-t border-gray-200">
                <dl>
                    <div class="bg-white px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-gray-500">Collection ID</dt>
                        <dd class="mt-1 text-sm text-gray-900 sm:col-span-2">{{ collecte?._id }}</dd>
                    </div>
                    <div class="bg-gray-50 px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-gray-500">Donation</dt>
                        <dd class="mt-1 text-sm text-gray-900 sm:col-span-2">{{ collecte?.donation?._id }}</dd>
                    </div>
                    <div class="bg-white px-4 py-5 sm:grid sm:grid-cols-3 sm:gap-4 sm:px-6">
                        <dt class="text-sm font-medium text-gray-500">Scheduled Date</dt>
                        <dd class="mt-1 text-sm text-gray-900 sm:col-span-2">
                            {{ collecte?.scheduledDate }}
                        </dd>
                    </div>
                </dl>
            </div>
        </div>
    </div>

    <!-- Assignment Form -->
    <div *ngIf="!loading && transporters.length > 0" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <form [formGroup]="assignForm" (ngSubmit)="onSubmit()">
            <div class="mb-6">
                <label for="transporterId" class="block text-gray-700 text-sm font-bold mb-2">Select
                    Transporter*</label>
                <select id="transporterId" formControlName="transporterId"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                    <option value="">-- Select a Transporter --</option>
                    <option *ngFor="let transporter of transporters" [value]="transporter._id">
                        {{ transporter.firstName }} {{ transporter.lastName }} ({{ transporter.email }})
                    </option>
                </select>
                <div *ngIf="f['transporterId'].touched && f['transporterId'].invalid" class="text-red-500 text-xs mt-1">
                    <div *ngIf="f['transporterId'].errors?.['required']">Please select a transporter.</div>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <button type="button" (click)="goBack()"
                    class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500">
                    Cancel
                </button>
                <button type="submit"
                    class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                    [disabled]="submitting">
                    <span *ngIf="submitting" class="inline-block mr-2">
                        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                    Assign Transporter
                </button>
            </div>
        </form>
    </div>

    <!-- No Transporters Message -->
    <div *ngIf="!loading && transporters.length === 0" class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
        <div class="flex items-center">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                        d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                        clip-rule="evenodd"></path>
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-sm text-yellow-700">No transporters are available. Please add transporters first.</p>
            </div>
        </div>
    </div>
</div>
