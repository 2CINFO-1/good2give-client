<div class="container mx-auto p-4">
    <div class="mb-6">
        <a routerLink="/scraps" class="text-emerald-600 hover:text-emerald-800 inline-flex items-center">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Back to Scraps
        </a>
    </div>

    <div *ngIf="isLoading" class="flex justify-center py-8">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-700"></div>
    </div>

    <div *ngIf="!isLoading" class="bg-white rounded-lg shadow-sm p-6">
        <div class="flex justify-between items-start mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">{{ scrap.name }}</h1>
            <span
                [ngClass]="scrap.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'"
                class="px-3 py-1 inline-flex text-sm leading-5 font-semibold rounded-full">
                {{ scrap.status }}
            </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <h2 class="text-lg font-medium text-gray-700 mb-3">Scrap Details</h2>
                <div class="bg-gray-50 p-4 rounded space-y-3">
                    <div class="flex justify-between">
                        <span class="text-gray-600">ID:</span>
                        <span class="font-medium">{{ scrap.id }}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Quantity:</span>
                        <span class="font-medium">{{ scrap.quantity }}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Date:</span>
                        <span class="font-medium">{{ scrap.date | date }}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Location:</span>
                        <span class="font-medium">{{ scrap.location }}</span>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="text-lg font-medium text-gray-700 mb-3">Description</h2>
                <div class="bg-gray-50 p-4 rounded">
                    <p class="text-gray-700">{{ scrap.description }}</p>
                </div>

                <h2 class="text-lg font-medium text-gray-700 mt-6 mb-3">Notes</h2>
                <div class="bg-gray-50 p-4 rounded">
                    <p class="text-gray-700">{{ scrap.notes }}</p>
                </div>
            </div>
        </div>

        <div class="flex justify-end space-x-4 mt-8">
            <button
                class="px-4 py-2 border border-emerald-600 text-emerald-600 rounded hover:bg-emerald-50 transition-colors">
                Edit
            </button>
            <button class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-colors">
                Delete
            </button>
        </div>
    </div>
</div>
