<div class="container mx-auto p-4">
    <div class="mb-6">
        <a routerLink="/scraps" class="text-emerald-600 hover:text-emerald-800 inline-flex items-center">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Back to Scraps
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Create New Scrap Item</h1>

        <form [formGroup]="scrapForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                <input type="text" id="name" formControlName="name"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="scrapForm.get('name')?.invalid && scrapForm.get('name')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Name is required
                </div>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea id="description" formControlName="description" rows="3"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>

            <div>
                <label for="quantity" class="block text-sm font-medium text-gray-700 mb-1">Quantity *</label>
                <input type="number" id="quantity" formControlName="quantity" min="1"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="scrapForm.get('quantity')?.invalid && scrapForm.get('quantity')?.touched"
                    class="text-red-500 text-sm mt-1">
                    <div *ngIf="scrapForm.get('quantity')?.errors?.['required']">Quantity is required</div>
                    <div *ngIf="scrapForm.get('quantity')?.errors?.['min']">Quantity must be at least 1</div>
                </div>
            </div>

            <div>
                <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location *</label>
                <input type="text" id="location" formControlName="location"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="scrapForm.get('location')?.invalid && scrapForm.get('location')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Location is required
                </div>
            </div>

            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea id="notes" formControlName="notes" rows="3"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit" [disabled]="scrapForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50">
                    <span *ngIf="isSubmitting" class="flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Creating...
                    </span>
                    <span *ngIf="!isSubmitting">Create Scrap Item</span>
                </button>
            </div>
        </form>
    </div>
</div>
