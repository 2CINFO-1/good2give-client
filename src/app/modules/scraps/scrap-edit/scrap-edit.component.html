<!-- Use a similar structure to your event edit form -->
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Edit Scrap</h2>

            <!-- Loading State -->
            <div *ngIf="loading && !scrap" class="flex justify-center items-center h-40">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-500"></div>
            </div>

            <!-- Error Message -->
            <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
                {{ error }}
            </div>

            <!-- Edit Form -->
            <form *ngIf="scrap && !loading" [formGroup]="scrapForm" (ngSubmit)="onSubmit()">
                <!-- Title -->
                <div class="mb-4">
                    <label for="title" class="block text-gray-700 font-medium mb-2">Title</label>
                    <input id="title" type="text" formControlName="title"
                        class="form-input w-full px-3 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                        [ngClass]="{ 'border-red-500': submitted && f['title'].errors }">
                    <div *ngIf="submitted && f['title'].errors" class="text-red-500 text-sm mt-1">
                        <div *ngIf="f['title'].errors['required']">Title is required</div>
                    </div>
                </div>

                <!-- Objective -->
                <div class="mb-4">
                    <label for="objective" class="block text-gray-700 font-medium mb-2">Objective</label>
                    <textarea id="objective" formControlName="objective"
                        class="form-textarea w-full px-3 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                        [ngClass]="{ 'border-red-500': submitted && f['objective'].errors }"></textarea>
                    <div *ngIf="submitted && f['objective'].errors" class="text-red-500 text-sm mt-1">
                        <div *ngIf="f['objective'].errors['required']">Objective is required</div>
                    </div>
                </div>

                <!-- Location -->
                <div class="mb-4">
                    <label for="location" class="block text-gray-700 font-medium mb-2">Location</label>
                    <input id="location" type="text" formControlName="location"
                        class="form-input w-full px-3 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                        [ngClass]="{ 'border-red-500': submitted && f['location'].errors }">
                    <div *ngIf="submitted && f['location'].errors" class="text-red-500 text-sm mt-1">
                        <div *ngIf="f['location'].errors['required']">Location is required</div>
                    </div>
                </div>

                <!-- Food Items (as comma-separated string for simplicity) -->
                <div class="mb-4">
                    <label for="foodItems" class="block text-gray-700 font-medium mb-2">Food Items (comma-separated)</label>
                    <input id="foodItems" type="text" formControlName="foodItems"
                        class="form-input w-full px-3 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                        [ngClass]="{ 'border-red-500': submitted && f['foodItems'].errors }">
                    <div *ngIf="submitted && f['foodItems'].errors" class="text-red-500 text-sm mt-1">
                        <div *ngIf="f['foodItems'].errors['required']">Food Items are required</div>
                    </div>
                </div>

                <!-- Date of Scrapping -->
                <div class="mb-6">
                    <label for="dateOfScrapping" class="block text-gray-700 font-medium mb-2">Date of Scrapping</label>
                    <input id="dateOfScrapping" type="date" formControlName="dateOfScrapping"
                        class="form-input w-full px-3 py-2 border rounded-lg text-gray-700 focus:outline-none focus:ring-emerald-500 focus:border-emerald-500"
                        [ngClass]="{ 'border-red-500': submitted && f['dateOfScrapping'].errors }">
                    <div *ngIf="submitted && f['dateOfScrapping'].errors" class="text-red-500 text-sm mt-1">
                        <div *ngIf="f['dateOfScrapping'].errors['required']">Date of Scrapping is required</div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex items-center justify-between">
                    <button type="submit"
                        class="bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-opacity-50"
                        [disabled]="loading">
                        <span *ngIf="loading" class="inline-block align-middle mr-2">
                            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </span>
                        {{ loading ? 'Saving...' : 'Save Changes' }}
                    </button>

                    <!-- Cancel Button -->
                    <button type="button" (click)="goBackToDetail()"
                        class="text-gray-600 hover:text-gray-800 focus:outline-none">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
