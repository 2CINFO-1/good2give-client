<div class="container mx-auto p-4">
    <div class="mb-6">
        <a routerLink="/dashboard/scraps" class="text-emerald-600 hover:text-emerald-800 inline-flex items-center">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Back to Scraps
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Create New Food Scrap</h1>

        <form [formGroup]="scrapForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input type="text" id="title" formControlName="title"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="scrapForm.get('title')?.invalid && scrapForm.get('title')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Title is required
                </div>
            </div>

            <div>
                <label for="objective" class="block text-sm font-medium text-gray-700 mb-1">Objective *</label>
                <textarea id="objective" formControlName="objective" rows="3"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                <div *ngIf="scrapForm.get('objective')?.invalid && scrapForm.get('objective')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Objective is required
                </div>
            </div>

            <div>
                <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location *</label>
                <input type="text" id="location" formControlName="location"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="scrapForm.get('location')?.invalid && scrapForm.get('location')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Location is required
                </div>
            </div>

            <div>
                <label for="foodItems" class="block text-sm font-medium text-gray-700 mb-1">Food Items *</label>
                <textarea id="foodItems" formControlName="foodItems" rows="3"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    placeholder="Enter food items separated by commas"></textarea>
                <div *ngIf="scrapForm.get('foodItems')?.invalid && scrapForm.get('foodItems')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Food items are required
                </div>
            </div>

            <div>
                <label for="dateOfScrapping" class="block text-sm font-medium text-gray-700 mb-1">Date of Scrapping *</label>
                <input type="date" id="dateOfScrapping" formControlName="dateOfScrapping"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="scrapForm.get('dateOfScrapping')?.invalid && scrapForm.get('dateOfScrapping')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Date of scrapping is required
                </div>
            </div>

            <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
                <span class="block sm:inline">{{ error }}</span>
            </div>

            <div class="flex justify-end pt-4">
                <button type="button" (click)="cancel()" class="px-4 py-2 mr-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors">
                    Cancel
                </button>
                <button type="submit" [disabled]="scrapForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50">
                    <span *ngIf="isSubmitting" class="flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Creating...
                    </span>
                    <span *ngIf="!isSubmitting">Create Food Scrap</span>
                </button>
            </div>
        </form>
    </div>
</div>
