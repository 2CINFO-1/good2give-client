<div class="p-6 max-w-7xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Create New Delivery</h1>
  
    <!-- Error Alert -->
    <div *ngIf="error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
      <div class="flex items-center">
        <div class="flex-shrink-0">
          <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
        <div class="ml-3">
          <p class="text-sm text-red-700">{{ errorMessage }}</p>
        </div>
      </div>
    </div>
  
    <form
      [formGroup]="deliveryForm"
      (ngSubmit)="onSubmit()"
      class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4"
    >
      <div class="mb-6">
        <label
          for="pickupDate"
          class="block text-gray-700 text-sm font-bold mb-2"
          >Pickup Date*</label
        >
        <input
          type="date"
          id="pickupDate"
          formControlName="pickupDate"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
        />
        <div
          *ngIf="f['pickupDate'].touched && f['pickupDate'].invalid"
          class="text-red-500 text-xs mt-1"
        >
          <div *ngIf="f['pickupDate'].errors?.['required']">
            Pickup date is required.
          </div>
        </div>
      </div>
  
      <div class="mb-6">
        <label
          for="expectedDeliveryDate"
          class="block text-gray-700 text-sm font-bold mb-2"
          >Expected Delivery Date</label
        >
        <input
          type="date"
          id="expectedDeliveryDate"
          formControlName="expectedDeliveryDate"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
        />
      </div>
  
      <div class="mb-6">
        <label
          for="beneficiaryId"
          class="block text-gray-700 text-sm font-bold mb-2"
          >Beneficiary ID*</label
        >
        <input
          type="text"
          id="beneficiaryId"
          formControlName="beneficiaryId"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          placeholder="Enter beneficiary ID"
        />
        <div
          *ngIf="f['beneficiaryId'].touched && f['beneficiaryId'].invalid"
          class="text-red-500 text-xs mt-1"
        >
          <div *ngIf="f['beneficiaryId'].errors?.['required']">
            Beneficiary ID is required.
          </div>
        </div>
      </div>
  
      <div class="mb-6">
        <label
          for="transporterId"
          class="block text-gray-700 text-sm font-bold mb-2"
          >Transporter ID</label>
        <input
          type="text"
          id="transporterId"
          formControlName="transporterId"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          placeholder="Enter transporter ID"
        />
      </div>
  
      <div class="flex items-center justify-between">
        <button
          type="button"
          routerLink="/dashboard/deliveries"
          class="px-4 py-2 bg-gray-300 text-gray-800 text-sm font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="inline-block mr-2">
            <svg
              class="animate-spin -ml-1 mr-2 h-4 w-4 text-white"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
              ></path>
            </svg>
          </span>
          Create Delivery
        </button>
      </div>
    </form>
  </div>
