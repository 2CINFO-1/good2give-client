<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Deliveries</h1>
      <a
        routerLink="/dashboard/deliveries/create"
        class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg flex items-center"
      >
        <span class="mr-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
              clip-rule="evenodd"
            />
          </svg>
        </span>
        New Delivery
      </a>
    </div>
  
    <!-- Loading state -->
    <div *ngIf="loading" class="flex justify-center my-8">
      <div
        class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"
      ></div>
    </div>
  
    <!-- Error state -->
    <div
      *ngIf="error"
      class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6"
    >
      <span class="block sm:inline">{{ error }}</span>
    </div>
  
    <!-- No results -->
    <div
      *ngIf="!loading && deliveries.length === 0"
      class="bg-gray-50 p-6 text-center rounded-lg"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-12 w-12 mx-auto text-gray-400 mb-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
        />
      </svg>
      <h3 class="text-lg font-medium text-gray-900 mb-2">No deliveries found</h3>
      <p class="text-gray-500">There are no deliveries scheduled at this time.</p>
    </div>
  
    <!-- Deliveries list -->
    <div
      *ngIf="!loading && deliveries.length > 0"
      class="bg-white shadow rounded-lg overflow-hidden"
    >
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th
              scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              ID
            </th>
            <th
              scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Status
            </th>
            <th
              scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Pickup Date
            </th>
            <th
              scope="col"
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <tr *ngFor="let delivery of deliveries">
            <td
              class="px-6 py-4 whitespace-nowrap text-sm font-medium text-blue-600"
            >
              <a [routerLink]="['/dashboard/deliveries', delivery._id]">
                {{ delivery._id.substring(0, 8) }}...
              </a>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span
                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                [ngClass]="{
                  'bg-yellow-100 text-yellow-800':
                    delivery.status === DeliveryStatus.PENDING,
                  'bg-blue-100 text-blue-800':
                    delivery.status === DeliveryStatus.IN_PROGRESS,
                  'bg-green-100 text-green-800':
                    delivery.status === DeliveryStatus.DELIVERED,
                  'bg-red-100 text-red-800':
                    delivery.status === DeliveryStatus.CANCELED
                }"
              >
                {{ delivery.status }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              {{ delivery.pickupDate | date : 'medium' }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
              <div class="flex space-x-2">
                <a
                  [routerLink]="['/dashboard/deliveries', delivery._id]"
                  class="text-blue-600 hover:text-blue-800"
                >
                  View
                </a>
                <button
                  *ngIf="delivery.status === DeliveryStatus.PENDING"
                  (click)="assignDelivery(delivery._id)"
                  class="text-green-600 hover:text-green-800"
                >
                  Assign
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Pagination -->
    <div *ngIf="totalItems > pageSize" class="flex justify-center mt-6">
      <nav class="flex space-x-2" aria-label="Pagination">
        <button
          (click)="onPageChange(currentPage - 1)"
          [disabled]="currentPage === 1"
          class="px-3 py-1 rounded-md bg-white border border-gray-300 text-gray-500 hover:bg-gray-50"
          [ngClass]="{
            'opacity-50 cursor-not-allowed': currentPage === 1
          }"
        >
          Previous
        </button>
        <div
          *ngFor="
            let page of [].constructor(Math.ceil(totalItems / pageSize));
            let i = index
          "
        >
          <button
            (click)="onPageChange(i + 1)"
            class="px-3 py-1 rounded-md"
            [ngClass]="{
              'bg-blue-600 text-white': currentPage === i + 1,
              'bg-white border border-gray-300 text-gray-500 hover:bg-gray-50':
                currentPage !== i + 1
            }"
          >
            {{ i + 1 }}
          </button>
        </div>
        <button
          (click)="onPageChange(currentPage + 1)"
          [disabled]="currentPage >= Math.ceil(totalItems / pageSize)"
          class="px-3 py-1 rounded-md bg-white border border-gray-300 text-gray-500 hover:bg-gray-50"
          [ngClass]="{
            'opacity-50 cursor-not-allowed':
              currentPage >= Math.ceil(totalItems / pageSize)
          }"
        >
          Next
        </button>
      </nav>
    </div>
  </div>
