<div class="min-h-screen bg-gray-50 pt-8">
    <div class="container mx-auto px-4">
        <!-- Header Section -->
        <div class="text-center mb-12">
            <h1 class="text-3xl font-bold mb-4">Reclamations</h1>
            <div class="h-1 w-24 bg-primary-600 mx-auto mb-6"></div>
            <button (click)="createReclamation()"
                class="bg-primary-600 text-white px-6 py-3 rounded-md hover:bg-primary-700 font-medium transition-all duration-300 hover:scale-105">
                Create New Reclamation
            </button>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="max-w-2xl mx-auto mb-8">
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p class="font-medium">Error</p>
                <p>{{ error }}</p>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="isLoading" class="flex justify-center my-12">
            <div class="p-4 rounded-full bg-primary-100 text-primary-600 w-16 h-16 flex items-center justify-center">
                <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary-600"></div>
            </div>
        </div>

        <!-- Search and Filter Section -->
        <div class="max-w-2xl mx-auto mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <div class="relative">
                        <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()"
                            placeholder="Search by ID, title, or subject..."
                            class="w-full p-3 pl-10 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <span class="material-icons absolute left-3 top-3 text-gray-400">search</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button (click)="onStatusFilterChange('all')"
                        [ngClass]="statusFilter === 'all' ? 'bg-primary-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                        class="px-4 py-2 rounded-md transition-colors">
                        All
                    </button>
                    <button (click)="onStatusFilterChange(ReclamationStatus.PENDING)"
                        [ngClass]="statusFilter === ReclamationStatus.PENDING ? 'bg-yellow-600 text-white' : 'bg-yellow-50 text-yellow-700 hover:bg-yellow-100'"
                        class="px-4 py-2 rounded-md transition-colors">
                        Pending
                    </button>
                    <button (click)="onStatusFilterChange(ReclamationStatus.RESOLVED)"
                        [ngClass]="statusFilter === ReclamationStatus.RESOLVED ? 'bg-green-600 text-white' : 'bg-green-50 text-green-700 hover:bg-green-100'"
                        class="px-4 py-2 rounded-md transition-colors">
                        Resolved
                    </button>
                    <button (click)="onStatusFilterChange(ReclamationStatus.CLOSED)"
                        [ngClass]="statusFilter === ReclamationStatus.CLOSED ? 'bg-gray-700 text-white' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'"
                        class="px-4 py-2 rounded-md transition-colors">
                        Closed
                    </button>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div *ngIf="!isLoading && filteredReclamations.length === 0" class="text-center my-16">
            <div class="p-4 rounded-full bg-primary-100 text-primary-600 mx-auto mb-4 w-20 h-20 flex items-center justify-center">
                <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4">
                    </path>
                </svg>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">No reclamations found</h3>
            <p class="text-gray-600 mb-8">Get started by creating a new reclamation.</p>
            <button (click)="createReclamation()"
                class="bg-primary-600 text-white px-6 py-3 rounded-md hover:bg-primary-700 font-medium transition-all duration-300 hover:scale-105">
                Create Your First Reclamation
            </button>
        </div>

        <!-- Reclamations Grid -->
        <div *ngIf="!isLoading && filteredReclamations.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let reclamation of filteredReclamations"
                class="bg-white rounded-lg shadow-lg overflow-hidden transition-all duration-300 hover:shadow-xl hover:scale-[1.02]">
                <div class="p-6">
                    <div class="mb-4">
                        <h2 class="text-xl font-bold text-gray-800 mb-2">{{ reclamation.title }}</h2>
                        <p class="text-gray-600 line-clamp-2">{{ reclamation.subject }}</p>
                    </div>
                    
                    <div class="flex items-center text-gray-500 mb-4">
                        <div class="p-2 rounded-full bg-primary-100 text-primary-600 mr-3">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <span class="font-medium">{{ reclamation.date | date }}</span>
                    </div>

                    <div class="flex items-center mb-6">
                        <div class="p-2 rounded-full bg-gray-100 text-gray-600 mr-3">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <span class="font-medium text-gray-700">{{ reclamation.userid.name }}</span>
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <span [ngClass]="{
                            'bg-yellow-100 text-yellow-800': reclamation.status === ReclamationStatus.PENDING,
                            'bg-green-100 text-green-800': reclamation.status === ReclamationStatus.RESOLVED,
                            'bg-gray-100 text-gray-800': reclamation.status === ReclamationStatus.CLOSED
                        }" class="px-3 py-1 rounded-full text-sm font-medium">
                            {{ formatStatusLabel(reclamation.status) }}
                        </span>
                    </div>

                    <div class="flex flex-wrap gap-3">
                        <button (click)="viewReclamation(reclamation._id)"
                            class="flex-1 bg-primary-600 text-white px-4 py-2 rounded-md hover:bg-primary-700 transition-colors text-sm font-medium">
                            View Details
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
