<div class="container mx-auto p-4">
    <div class="mb-6">
        <a routerLink="/dashboard/reclamations"
            class="text-emerald-600 hover:text-emerald-800 inline-flex items-center">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Back to Reclamations
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Create New Reclamation</h1>

        <div *ngIf="error" class="bg-red-50 text-red-700 p-3 rounded mb-4">
            {{ error }}
        </div>

        <form [formGroup]="reclamationForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input type="text" id="title" formControlName="title"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="reclamationForm.get('title')?.invalid && reclamationForm.get('title')?.touched"
                    class="text-red-500 text-sm mt-1">
                    <span *ngIf="reclamationForm.get('title')?.errors?.['required']">
                        Title is required
                    </span>
                    <span *ngIf="reclamationForm.get('title')?.errors?.['minlength']">
                        Title must be at least 5 characters
                    </span>
                </div>
            </div>

            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject *</label>
                <textarea id="subject" formControlName="subject" rows="4"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                <div *ngIf="reclamationForm.get('subject')?.invalid && reclamationForm.get('subject')?.touched"
                    class="text-red-500 text-sm mt-1">
                    <span *ngIf="reclamationForm.get('subject')?.errors?.['required']">
                        Subject is required
                    </span>
                    <span *ngIf="reclamationForm.get('subject')?.errors?.['minlength']">
                        Subject must be at least 20 characters
                    </span>
                </div>
            </div>

            <div>
                <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                <input type="date" id="date" formControlName="date"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="reclamationForm.get('date')?.invalid && reclamationForm.get('date')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Date is required
                </div>
            </div>

            <div>
                <label for="attachments" class="block text-sm font-medium text-gray-700 mb-1">Attachments</label>
                <input type="file" id="attachments" class="w-full p-2">
                <p class="text-xs text-gray-500 mt-1">Upload relevant documents or images (optional)</p>
            </div>

            <div class="flex justify-between pt-4">
                <button type="button" (click)="onCancel()"
                    class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 transition-colors">
                    Cancel
                </button>
                <button type="submit" [disabled]="reclamationForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50">
                    <span *ngIf="isSubmitting" class="flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Creating...
                    </span>
                    <span *ngIf="!isSubmitting">Create Reclamation</span>
                </button>
            </div>
        </form>
    </div>
</div>
