<div class="min-h-screen bg-gray-50 pt-8">
    <div class="container mx-auto px-4">
        <!-- Header Section -->
        <div class="text-center mb-12">
            <h1 class="text-3xl font-bold mb-4">Create New Reclamation</h1>
            <div class="h-1 w-24 bg-primary-600 mx-auto mb-6"></div>
            <button (click)="onCancel()" class="flex items-center text-primary-600 hover:text-primary-800 transition-colors mx-auto">
                <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Back to Reclamations
            </button>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="max-w-2xl mx-auto mb-8">
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4" role="alert">
                <p class="font-medium">Error</p>
                <p>{{ error }}</p>
            </div>
        </div>

        <!-- Form -->
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <form [formGroup]="reclamationForm" (ngSubmit)="onSubmit()">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Title -->
                        <div class="col-span-2">
                            <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title *</label>
                            <input type="text" id="title" formControlName="title"
                                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500"
                                placeholder="Enter reclamation title">
                            <div *ngIf="reclamationForm.get('title')?.touched && reclamationForm.get('title')?.invalid" 
                                class="mt-2 text-sm text-red-600">
                                <div *ngIf="reclamationForm.get('title')?.errors?.['required']">Title is required.</div>
                                <div *ngIf="reclamationForm.get('title')?.errors?.['minlength']">Title must be at least 5 characters.</div>
                            </div>
                        </div>

                        <!-- Subject -->
                        <div class="col-span-2">
                            <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">Subject *</label>
                            <textarea id="subject" formControlName="subject" rows="4"
                                class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500"
                                placeholder="Enter reclamation subject"></textarea>
                            <div *ngIf="reclamationForm.get('subject')?.touched && reclamationForm.get('subject')?.invalid" 
                                class="mt-2 text-sm text-red-600">
                                <div *ngIf="reclamationForm.get('subject')?.errors?.['required']">Subject is required.</div>
                                <div *ngIf="reclamationForm.get('subject')?.errors?.['minlength']">Subject must be at least 20 characters.</div>
                            </div>
                        </div>

                        <!-- Date -->
                        <div class="col-span-2 lg:col-span-1">
                            <label for="date" class="block text-sm font-medium text-gray-700 mb-2">Date *</label>
                            <div class="relative">
                                <input type="date" id="date" formControlName="date"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500">
                            </div>
                            <div *ngIf="reclamationForm.get('date')?.touched && reclamationForm.get('date')?.invalid" 
                                class="mt-2 text-sm text-red-600">
                                <div *ngIf="reclamationForm.get('date')?.errors?.['required']">Date is required.</div>
                            </div>
                        </div>

                        <!-- Attachments -->
                        <div class="col-span-2 lg:col-span-1">
                            <label for="attachments" class="block text-sm font-medium text-gray-700 mb-2">Attachments</label>
                            <div class="relative">
                                <input type="file" id="attachments" 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500">
                                <p class="text-xs text-gray-500 mt-2">Upload relevant documents or images (optional)</p>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="col-span-2 flex justify-end space-x-4 mt-8">
                            <button type="button" (click)="onCancel()"
                                class="px-6 py-3 border border-gray-300 text-gray-700 rounded-md hover:bg-gray-50 transition-all duration-300 font-medium">
                                Cancel
                            </button>
                            <button type="submit" [disabled]="reclamationForm.invalid || isSubmitting"
                                class="px-6 py-3 bg-primary-600 text-white rounded-md hover:bg-primary-700 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center font-medium">
                                <span *ngIf="isSubmitting" class="mr-2">
                                    <div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-white"></div>
                                </span>
                                {{ isSubmitting ? 'Creating...' : 'Create Reclamation' }}
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
