<div class="container mx-auto p-4">
    <div class="mb-6">
        <a [routerLink]="['/reclamations', reclamationId]"
            class="text-emerald-600 hover:text-emerald-800 inline-flex items-center">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Back to Reclamation
        </a>
    </div>

    <div *ngIf="isLoading" class="flex justify-center py-8">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-700"></div>
    </div>

    <div *ngIf="!isLoading" class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Update Reclamation #{{ reclamationId }}</h1>

        <form [formGroup]="reclamationForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input type="text" id="title" formControlName="title"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="reclamationForm.get('title')?.invalid && reclamationForm.get('title')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Title is required
                </div>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                <textarea id="description" formControlName="description" rows="4"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                <div *ngIf="reclamationForm.get('description')?.invalid && reclamationForm.get('description')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Description is required
                </div>
            </div>

            <div>
                <label for="productId" class="block text-sm font-medium text-gray-700 mb-1">Product ID *</label>
                <input type="text" id="productId" formControlName="productId"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <div *ngIf="reclamationForm.get('productId')?.invalid && reclamationForm.get('productId')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Product ID is required
                </div>
            </div>

            <div>
                <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status *</label>
                <select id="status" formControlName="status"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="">Select a status</option>
                    <option value="new">New</option>
                    <option value="in-progress">In Progress</option>
                    <option value="resolved">Resolved</option>
                    <option value="closed">Closed</option>
                </select>
                <div *ngIf="reclamationForm.get('status')?.invalid && reclamationForm.get('status')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Status is required
                </div>
            </div>

            <div>
                <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Priority *</label>
                <select id="priority" formControlName="priority"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                </select>
                <div *ngIf="reclamationForm.get('priority')?.invalid && reclamationForm.get('priority')?.touched"
                    class="text-red-500 text-sm mt-1">
                    Priority is required
                </div>
            </div>

            <div>
                <label for="attachments" class="block text-sm font-medium text-gray-700 mb-1">Attachments</label>
                <input type="file" id="attachments" class="w-full p-2">
                <p class="text-xs text-gray-500 mt-1">Upload relevant documents or images (optional)</p>
            </div>

            <div class="flex justify-end pt-4">
                <button type="submit" [disabled]="reclamationForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50">
                    <span *ngIf="isSubmitting" class="flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Updating...
                    </span>
                    <span *ngIf="!isSubmitting">Update Reclamation</span>
                </button>
            </div>
        </form>
    </div>
</div>
