<div class="container mx-auto p-4">
    <div class="mb-6">
        <a [routerLink]="['/dashboard/reclamations', reclamationId]"
            class="text-emerald-600 hover:text-emerald-800 inline-flex items-center">
            <span class="material-icons mr-1 text-sm">arrow_back</span>
            Back to Reclamation
        </a>
    </div>

    <div *ngIf="isLoading" class="flex justify-center py-8">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-700"></div>
    </div>

    <div *ngIf="!isLoading" class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Update Reclamation #{{ reclamationId?.slice(-6) }}</h1>

        <form [formGroup]="reclamationForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                <input type="text" id="title" formControlName="title"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    [class.border-red-500]="title?.invalid && title?.touched">
                <div *ngIf="title?.invalid && title?.touched" class="text-red-500 text-sm mt-1">
                    <div *ngIf="title?.errors?.['required']">Title is required</div>
                    <div *ngIf="title?.errors?.['minlength']">Title must be at least 5 characters long</div>
                </div>
            </div>

            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject *</label>
                <textarea id="subject" formControlName="subject" rows="4"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    placeholder="Describe your reclamation in detail..."
                    [class.border-red-500]="subject?.invalid && subject?.touched"></textarea>
                <div *ngIf="subject?.invalid && subject?.touched" class="text-red-500 text-sm mt-1">
                    <div *ngIf="subject?.errors?.['required']">Subject is required</div>
                    <div *ngIf="subject?.errors?.['minlength']">Subject must be at least 10 characters long</div>
                </div>
            </div>

            <div>
                <label for="userid" class="block text-sm font-medium text-gray-700 mb-1">User ID *</label>
                <input type="text" id="userid" formControlName="userid"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    placeholder="User ID associated with this reclamation"
                    [class.border-red-500]="userid?.invalid && userid?.touched">
                <div *ngIf="userid?.invalid && userid?.touched" class="text-red-500 text-sm mt-1">
                    <div *ngIf="userid?.errors?.['required']">User ID is required</div>
                </div>
            </div>

            <div>
                <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                <input type="date" id="date" formControlName="date"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    [class.border-red-500]="date?.invalid && date?.touched">
                <div *ngIf="date?.invalid && date?.touched" class="text-red-500 text-sm mt-1">
                    <div *ngIf="date?.errors?.['required']">Date is required</div>
                </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" (click)="onCancel()"
                    class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 transition-colors">
                    Cancel
                </button>
                <button type="submit" [disabled]="reclamationForm.invalid || isSubmitting"
                    class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50">
                    <span *ngIf="isSubmitting" class="flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Updating...
                    </span>
                    <span *ngIf="!isSubmitting">Update Reclamation</span>
                </button>
            </div>
        </form>
    </div>
</div>
