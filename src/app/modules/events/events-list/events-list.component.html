<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Events</h1>
        <button (click)="createEvent()"
            class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
            Create Event
        </button>
    </div>

    <!-- Error Message -->
    <div *ngIf="error" class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
        <p>{{ error }}</p>
    </div>

    <!-- Loading Spinner -->
    <div *ngIf="loading" class="flex justify-center my-8">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && events.length === 0" class="text-center my-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
            </path>
        </svg>
        <h3 class="mt-2 text-lg font-medium text-gray-900">No events found</h3>
        <p class="mt-1 text-sm text-gray-500">Get started by creating a new event.</p>
        <div class="mt-6">
            <button (click)="createEvent()"
                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                Create Event
            </button>
        </div>
    </div>

    <!-- Events List -->
    <div *ngIf="!loading && events.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div *ngFor="let event of events"
            class="bg-white rounded-lg shadow overflow-hidden transition-transform hover:scale-105">
            <div class="p-6">
                <div class="flex justify-between items-start">
                    <h2 class="text-xl font-semibold text-gray-800 mb-2">{{ event.title }}</h2>
                </div>
                <p class="text-gray-600 mb-4 line-clamp-2">{{ event.objective }}</p>
                <div class="flex items-center text-gray-500 mb-4">
                    <svg class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span>{{ event.date }}</span>
                </div>

                <div class="flex flex-wrap justify-between mt-4">
                    <button (click)="goToEventDetail(event._id)"
                        class="px-3 py-1.5 bg-blue-600 text-white text-sm rounded hover:bg-blue-700 transition-colors">
                        View Details
                    </button>

                    <div class="flex gap-2">
                        <button (click)="editEvent(event._id, event)"
                            class="px-3 py-1.5 bg-yellow-600 text-white text-sm rounded hover:bg-yellow-700 transition-colors">
                            Edit
                        </button>
                        <button (click)="deleteEvent(event._id)"
                            class="px-3 py-1.5 bg-red-600 text-white text-sm rounded hover:bg-red-700 transition-colors">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
