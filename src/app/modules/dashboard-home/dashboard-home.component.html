<div class="container mx-auto px-4 py-6">
    <h1 class="text-2xl font-semibold text-gray-800 mb-6">Dashboard</h1>

    <!-- Statistics Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <!-- Loading skeleton -->
        <ng-container *ngIf="isLoading">
            <div *ngFor="let i of [1,2,3,4]" class="bg-white rounded-lg shadow p-6 animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
                <div class="h-6 bg-gray-300 rounded w-1/3"></div>
            </div>
        </ng-container>

        <!-- Actual stats -->
        <ng-container *ngIf="!isLoading">
            <!-- Donations Card -->
            <div class="bg-white rounded-lg shadow p-6 border-t-4 border-blue-500">
                <h2 class="text-gray-600 text-sm font-medium uppercase">Total Donations</h2>
                <p class="text-3xl font-bold text-gray-800">{{ stats.donations }}</p>
            </div>

            <!-- Collections Card -->
            <div class="bg-white rounded-lg shadow p-6 border-t-4 border-green-500">
                <h2 class="text-gray-600 text-sm font-medium uppercase">Collections</h2>
                <p class="text-3xl font-bold text-gray-800">{{ stats.collections }}</p>
            </div>

            <!-- Products Card -->
            <div class="bg-white rounded-lg shadow p-6 border-t-4 border-purple-500">
                <h2 class="text-gray-600 text-sm font-medium uppercase">Products</h2>
                <p class="text-3xl font-bold text-gray-800">{{ stats.products }}</p>
            </div>

            <!-- Events Card -->
            <div class="bg-white rounded-lg shadow p-6 border-t-4 border-yellow-500">
                <h2 class="text-gray-600 text-sm font-medium uppercase">Events</h2>
                <p class="text-3xl font-bold text-gray-800">{{ stats.events }}</p>
            </div>
        </ng-container>
    </div>

    <!-- Quick Access Links -->
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Quick Access</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <a routerLink="/dashboard/donations"
                class="flex items-center p-3 rounded-lg hover:bg-blue-50 transition-colors">
                <span class="bg-blue-100 p-2 rounded-full text-blue-500 mr-3">
                    <i class="fas fa-gift"></i>
                </span>
                <span class="text-gray-700">Manage Donations</span>
            </a>
            <a routerLink="/dashboard/collectes"
                class="flex items-center p-3 rounded-lg hover:bg-green-50 transition-colors">
                <span class="bg-green-100 p-2 rounded-full text-green-500 mr-3">
                    <i class="fas fa-truck"></i>
                </span>
                <span class="text-gray-700">Collectes</span>
            </a>
            <a routerLink="/dashboard/products"
                class="flex items-center p-3 rounded-lg hover:bg-purple-50 transition-colors">
                <span class="bg-purple-100 p-2 rounded-full text-purple-500 mr-3">
                    <i class="fas fa-box"></i>
                </span>
                <span class="text-gray-700">Products</span>
            </a>
            <a routerLink="/dashboard/events"
                class="flex items-center p-3 rounded-lg hover:bg-yellow-50 transition-colors">
                <span class="bg-yellow-100 p-2 rounded-full text-yellow-500 mr-3">
                    <i class="fas fa-calendar"></i>
                </span>
                <span class="text-gray-700">Events</span>
            </a>
        </div>
    </div>
</div>
