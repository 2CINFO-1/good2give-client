<div class="h-full bg-gray-900 text-white w-64 flex-shrink-0">
    <div class="p-4 bg-gray-800 flex items-center">
        <img src="assets/logo.png" alt="Logo" class="h-8 w-8 mr-2">
        <h1 class="text-xl font-bold">Good2Give</h1>
    </div>
    <nav class="py-4">
        <ul>
            <li *ngFor="let item of sidebarItems">
                <a [routerLink]="item.route" routerLinkActive="bg-blue-600"
                    [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
                    class="flex items-center px-4 py-3 hover:bg-gray-800 transition-colors">
                    <i [class]="item.icon + ' mr-3 w-5 text-center'" aria-hidden="true"></i>
                    <span>{{ item.title }}</span>
                </a>
            </li>
        </ul>
    </nav>
</div>
