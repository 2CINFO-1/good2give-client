<nav class="bg-white shadow-sm">
    <div class="container mx-auto px-4">
        <ul class="flex space-x-6 overflow-x-auto py-4">
            <li *ngFor="let item of navItems">
                <a [routerLink]="item.route" routerLinkActive="text-blue-600 font-semibold"
                    [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
                    class="flex items-center text-gray-700 hover:text-blue-600 transition-colors">
                    <i [class]="item.icon + ' mr-2'" aria-hidden="true"></i>
                    <span>{{ item.title }}</span>
                </a>
            </li>
        </ul>
    </div>
</nav>
