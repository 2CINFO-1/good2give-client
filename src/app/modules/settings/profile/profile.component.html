<div class="space-y-6">
    <h2 class="text-xl font-semibold text-gray-800">Profile Settings</h2>

    <div *ngIf="successMessage" class="bg-green-50 border border-green-400 text-green-700 px-4 py-3 rounded">
        {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 border border-red-400 text-red-700 px-4 py-3 rounded">
        {{ errorMessage }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Personal Information -->
        <div class="space-y-4">
            <h3 class="text-lg font-medium text-gray-700">Personal Information</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
                    <input type="text" id="firstName" formControlName="firstName"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <div *ngIf="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched"
                        class="text-red-500 text-sm mt-1">
                        First Name is required
                    </div>
                </div>

                <div>
                    <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
                    <input type="text" id="lastName" formControlName="lastName"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <div *ngIf="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched"
                        class="text-red-500 text-sm mt-1">
                        Last Name is required
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
                    <input type="email" id="email" formControlName="email"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <div *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
                        class="text-red-500 text-sm mt-1">
                        <div *ngIf="profileForm.get('email')?.errors?.['required']">Email is required</div>
                        <div *ngIf="profileForm.get('email')?.errors?.['email']">Please enter a valid email</div>
                    </div>
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                    <input type="tel" id="phone" formControlName="phone"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <div *ngIf="profileForm.get('phone')?.invalid && profileForm.get('phone')?.touched"
                        class="text-red-500 text-sm mt-1">
                        Please enter a valid phone number
                    </div>
                </div>
            </div>
        </div>

        <!-- Address Information -->
        <div class="space-y-4">
            <h3 class="text-lg font-medium text-gray-700">Address Information</h3>

            <div>
                <label for="address" class="block text-sm font-medium text-gray-700 mb-1">Street Address</label>
                <input type="text" id="address" formControlName="address"
                    class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
                    <input type="text" id="city" formControlName="city"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label for="state" class="block text-sm font-medium text-gray-700 mb-1">State/Province</label>
                    <input type="text" id="state" formControlName="state"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label for="zipCode" class="block text-sm font-medium text-gray-700 mb-1">Zip/Postal Code</label>
                    <input type="text" id="zipCode" formControlName="zipCode"
                        class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>
        </div>

        <div class="flex justify-end pt-4">
            <button type="submit" [disabled]="isSubmitting"
                class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700 transition-colors disabled:opacity-50">
                <span *ngIf="isSubmitting" class="flex items-center">
                    <svg class="animate-spin h-4 w-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Saving...
                </span>
                <span *ngIf="!isSubmitting">Save Changes</span>
            </button>
        </div>
    </form>
</div>
