<div class="container mx-auto p-6">
    <div class="flex flex-col lg:flex-row gap-6">
        <!-- Settings Navigation -->
        <div class="w-full lg:w-1/4">
            <div class="bg-white rounded-lg shadow p-4">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Settings</h2>
                <nav class="space-y-1">
                    <a *ngFor="let item of navItems" [routerLink]="item.path"
                        routerLinkActive="bg-emerald-50 text-emerald-600"
                        class="flex items-center px-3 py-2 text-sm font-medium text-gray-700 rounded-md hover:bg-gray-50 hover:text-gray-900 transition-colors">
                        <span class="material-icons text-sm mr-3">{{ item.icon }}</span>
                        {{ item.label }}
                    </a>
                </nav>
            </div>
        </div>

        <!-- Settings Content -->
        <div class="w-full lg:w-3/4">
            <div class="bg-white rounded-lg shadow p-4 min-h-[500px]">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
