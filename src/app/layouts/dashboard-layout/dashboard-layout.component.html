<div class="flex h-screen bg-gray-100">
    <!-- Sidebar -->
    <aside [ngClass]="{'w-64': isSidebarOpen, 'w-20': !isSidebarOpen}"
        class="bg-gray-800 text-white transition-all duration-300">
        <!-- Logo -->
        <div class="p-4 flex items-center justify-between">
            <a routerLink="/dashboard" class="flex items-center">
                <span class="text-xl font-bold text-emerald-500" *ngIf="isSidebarOpen">Good2Give</span>
                <span class="text-xl font-bold text-emerald-500" *ngIf="!isSidebarOpen">G2G</span>
            </a>
            <button (click)="toggleSidebar()" class="text-gray-400 hover:text-white">
                <svg *ngIf="isSidebarOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                </svg>
                <svg *ngIf="!isSidebarOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <!-- Menu items -->
        <nav class="mt-5">
            <ul>
                <li *ngFor="let item of menuItems">
                    <a [routerLink]="item.route" routerLinkActive="bg-gray-900 text-emerald-500"
                        [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
                        class="flex items-center py-3 px-4 hover:bg-gray-700 transition-colors">
                        <span class="material-icons">{{item.icon}}</span>
                        <span *ngIf="isSidebarOpen" class="ml-3">{{item.name}}</span>
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="flex items-center justify-between p-4">
                <h1 class="text-2xl font-semibold text-gray-800">Dashboard</h1>

                <div class="flex items-center space-x-4">
                    <!-- Notifications -->
                    <button class="text-gray-500 hover:text-gray-700 relative">
                        <span class="material-icons">notifications</span>
                        <span
                            class="absolute top-0 right-0 h-4 w-4 bg-red-500 rounded-full text-xs text-white flex items-center justify-center">2</span>
                    </button>

                    <!-- Profile Dropdown -->
                    <div class="relative" *ngIf="currentUser">
                        <div class="flex items-center space-x-3 cursor-pointer">
                            <div
                                class="h-8 w-8 rounded-full bg-emerald-500 flex items-center justify-center text-white uppercase font-medium">
                                {{currentUser && currentUser.name ? currentUser.name.charAt(0) : 'U'}}
                            </div>
                            <div *ngIf="isSidebarOpen">
                                <div class="text-sm font-medium text-gray-700">{{currentUser.name || 'User'}}</div>
                                <div class="text-xs text-gray-500">{{currentUser.role || 'Guest'}}</div>
                            </div>
                        </div>

                        <!-- Dropdown menu -->
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-10 hidden">
                            <a routerLink="/dashboard/settings"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                Settings
                            </a>
                            <a href="#" (click)="logout()"
                                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                Logout
                            </a>
                        </div>
                    </div>

                    <!-- Logout Button -->
                    <button (click)="logout()"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-md text-sm font-medium">
                        <span class="material-icons text-sm">logout</span>
                        <span *ngIf="isSidebarOpen" class="ml-1">Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page content -->
        <main class="flex-1 overflow-auto bg-gray-100 p-4">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
