<div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center">
                    <a routerLink="/" class="flex items-center">
                        <img src="assets/logo.svg" alt="Good2Give Logo" class="h-10 w-auto mr-3" />
                        <span class="text-xl font-bold text-green-700">Good2Give</span>
                    </a>
                </div>

                <div class="hidden md:flex items-center space-x-8">
                    <a routerLink="/" class="text-gray-600 hover:text-green-600">Home</a>
                    <a routerLink="/about" class="text-gray-600 hover:text-green-600">About</a>
                    <a routerLink="/contact" class="text-gray-600 hover:text-green-600">Contact</a>
                </div>

                <div class="flex items-center space-x-4">
                    <ng-container *ngIf="!isAuthenticated">
                        <a routerLink="/login" class="text-gray-600 hover:text-green-600 font-medium">Sign in</a>
                        <a routerLink="/register"
                            class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 font-medium">Sign
                            up</a>
                    </ng-container>

                    <ng-container *ngIf="isAuthenticated">
                        <a routerLink="/dashboard"
                            class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 font-medium">
                            Dashboard
                        </a>
                    </ng-container>
                </div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="flex-grow">
        <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-12">
        <div class="container mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Quick Links -->
                <div>
                    <h3 class="text-lg font-semibold mb-4">Quick Links</h3>
                    <ul class="space-y-2">
                        <li><a routerLink="/" class="text-gray-300 hover:text-white">Home</a></li>
                        <li><a routerLink="/about" class="text-gray-300 hover:text-white">About Us</a></li>
                        <li><a routerLink="/contact" class="text-gray-300 hover:text-white">Contact</a></li>
                        <li><a routerLink="/register" class="text-gray-300 hover:text-white">Register</a></li>
                    </ul>
                </div>

                <!-- Resources -->
                <div>
                    <h3 class="text-lg font-semibold mb-4">Resources</h3>
                    <ul class="space-y-2">
                        <li><a routerLink="/faq" class="text-gray-300 hover:text-white">FAQ</a></li>
                        <li><a routerLink="/privacy" class="text-gray-300 hover:text-white">Privacy Policy</a></li>
                        <li><a routerLink="/terms" class="text-gray-300 hover:text-white">Terms of Service</a></li>
                    </ul>
                </div>

                <!-- Connect -->
                <div>
                    <h3 class="text-lg font-semibold mb-4">Connect With Us</h3>
                    <div class="flex space-x-4 mb-4">
                        <a href="#" class="text-gray-300 hover:text-white">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="#" class="text-gray-300 hover:text-white">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="text-gray-300 hover:text-white">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="#" class="text-gray-300 hover:text-white">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                    </div>
                    <p class="text-sm text-gray-400">
                        Subscribe to our newsletter for updates on upcoming events.
                    </p>
                </div>
            </div>

            <div class="border-t border-gray-700 mt-8 pt-8 text-center text-sm text-gray-400">
                <p>&copy; 2023 Good2Give. All rights reserved.</p>
            </div>
        </div>
    </footer>
</div>
